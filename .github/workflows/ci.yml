name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rspec:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tasklink_test
        ports:
          - 5432:5432

    env:
      RAILS_ENV: test
      DATABASE_HOST: localhost
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: password

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.10
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: Setup database
        run: |
          bin/rails db:create
          bin/rails db:migrate

      - name: Run RSpec
        run: bundle exec rspec

  rubocop:
    runs-on: ubuntu-latest

    steps:
     - name: Checkout
       uses: actions/checkout@v6

     - name: Set up Ruby
       uses: ruby/setup-ruby@v1
       with:
        ruby-version: 3.3.10
        bundler-cache: true

     - name: Run RuboCop
       run: bundle exec rubocop

  brakeman:
    runs-on: ubuntu-latest

    steps:
     - name: Checkout
       uses: actions/checkout@v6

     - name: Set up Ruby
       uses: ruby/setup-ruby@v1
       with:
        ruby-version: 3.3.10
        bundler-cache: true

     - name: Run Brakeman
       run: bundle exec brakeman

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker compose build
